    :root {
      --bg-dark: #0b0e14;
      --panel-bg: rgba(18, 24, 38, 0.85);
      --card-bg: rgba(26, 34, 52, 0.7);
      --card-hover: rgba(36, 48, 74, 0.9);
      --gold-primary: #e6b450;
      --gold-glow: rgba(230, 180, 80, 0.35);
      --cyan-accent: #38bdf8;
      --crimson-accent: #ef4444;
      --emerald-accent: #10b981;
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
      --border-color: rgba(230, 180, 80, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% 10%, #151d2f 0%, var(--bg-dark) 100%);
      color: var(--text-main);
      font-family: 'Noto Sans JP', sans-serif;
      min-height: 100vh;
      padding: 24px 20px 60px;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
    }

    /* Header */
    .studio-header {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px 30px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .title-group h1 {
      font-family: 'Cinzel', serif;
      font-size: 26px;
      letter-spacing: 2px;
      color: var(--gold-primary);
      text-shadow: 0 0 16px var(--gold-glow);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-group p {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .vol-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.4);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .vol-box label {
      font-size: 12px;
      color: var(--gold-primary);
      font-weight: bold;
    }

    .vol-slider {
      accent-color: var(--gold-primary);
      width: 100px;
      cursor: pointer;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .nav-btn:hover {
      background: rgba(230, 180, 80, 0.15);
      border-color: var(--gold-primary);
      color: var(--gold-primary);
    }

    /* Simulation Bar */
    .sim-bar {
      background: rgba(18, 24, 38, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .sim-label {
      font-size: 13px;
      color: var(--gold-primary);
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sim-btn {
      background: linear-gradient(135deg, rgba(230, 180, 80, 0.15), rgba(230, 180, 80, 0.05));
      border: 1px solid var(--gold-primary);
      color: #fef08a;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .sim-btn:hover {
      background: var(--gold-primary);
      color: #000;
      box-shadow: 0 0 12px var(--gold-glow);
    }

    /* Section Category */
    .category-section {
      margin-bottom: 32px;
    }

    .category-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(230, 180, 80, 0.25);
    }

    .category-header h2 {
      font-size: 18px;
      font-family: 'Cinzel', serif;
      letter-spacing: 1px;
      color: var(--gold-primary);
    }

    .category-header .badge {
      background: rgba(230, 180, 80, 0.15);
      color: var(--gold-primary);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: bold;
    }

    /* Grid Layout */
    .se-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(370px, 1fr));
      gap: 16px;
    }

    /* SE Card */
    .se-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .se-card:hover {
      background: var(--card-hover);
      border-color: rgba(230, 180, 80, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .se-card.playing {
      border-color: var(--gold-primary);
      box-shadow: 0 0 16px var(--gold-glow);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .card-title-group {
      flex: 1;
    }

    .card-key {
      font-family: monospace;
      font-size: 11px;
      color: var(--cyan-accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-label {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      margin: 2px 0 4px;
    }

    .card-desc {
      font-size: 12px;
      color: var(--text-sub);
      line-height: 1.4;
    }

    .duration-pill {
      font-family: monospace;
      font-size: 11px;
      padding: 2px 7px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      color: #cbd5e1;
      white-space: nowrap;
    }

    /* Buttons Row */
    .button-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 4px;
    }

    .play-btn-primary {
      background: linear-gradient(135deg, #e6b450 0%, #b8860b 100%);
      color: #000;
      border: none;
      border-radius: 6px;
      padding: 7px 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .play-btn-primary:hover {
      filter: brightness(1.15);
      transform: scale(1.02);
      box-shadow: 0 0 12px var(--gold-glow);
    }

    .play-btn-alt {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #e2e8f0;
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .play-btn-alt:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--cyan-accent);
      color: var(--cyan-accent);
    }

    /* Status indicator bar on bottom */
    .playing-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      background: var(--gold-primary);
      width: 0%;
      opacity: 0;
      transition: width linear, opacity 0.2s;
    }

    .se-card.playing .playing-bar {
      opacity: 1;
      width: 100%;
    }
  </style>
</head>

  // Audio Context Manager
  let audioCtx = null;
  let masterGain = null;
  const audioCache = {};

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = parseFloat(document.getElementById('masterVol').value);
      masterGain.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  // Volume Slider Handler
  const volSlider = document.getElementById('masterVol');
  const volVal = document.getElementById('volVal');
  volSlider.addEventListener('input', (e) => {
    const val = parseFloat(e.target.value);
    volVal.textContent = Math.round(val * 100) + '%';
    if (masterGain) {
      masterGain.gain.setValueAtTime(val, audioCtx.currentTime);
    }
    localStorage.setItem('dcg_se_volume', val);
  });

  // Play Sound with visual feedback
  async function playSound(url, cardElement, durationSec = 1.0) {
    initAudio();
    try {
      let buffer = audioCache[url];
      if (!buffer) {
        const res = await fetch(url);
        if (!res.ok) throw new Error('File not found: ' + url);
        const ab = await res.arrayBuffer();
        buffer = await audioCtx.decodeAudioData(ab);
        audioCache[url] = buffer;
      }

      const src = audioCtx.createBufferSource();
      src.buffer = buffer;
      src.connect(masterGain);
      src.start();

      if (cardElement) {
        cardElement.classList.add('playing');
        const bar = cardElement.querySelector('.playing-bar');
        if (bar) {
          bar.style.transitionDuration = buffer.duration + 's';
        }
        setTimeout(() => {
          cardElement.classList.remove('playing');
          if (bar) {
            bar.style.transitionDuration = '0.2s';
          }
        }, Math.max(250, buffer.duration * 1000));
      }
    } catch (err) {
      console.error('Play error:', err);
    }
  }

  // Render Category Sections
  const container = document.getElementById('categoriesContainer');
  seData.forEach(cat => {
    const section = document.createElement('section');
    section.className = 'category-section';

    const header = document.createElement('div');
    header.className = 'category-header';
    header.innerHTML = `
      <h2>${cat.icon} ${cat.category}</h2>
      <span class="badge">${cat.items.length} SOUNDS</span>
    `;
    section.appendChild(header);

    const grid = document.createElement('div');
    grid.className = 'se-grid';

    cat.items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'se-card';
      card.id = 'card-' + item.key;

      let altsHtml = '';
      if (item.alts && item.alts.length > 0) {
        item.alts.forEach((alt, idx) => {
          altsHtml += `
            <button class="play-btn-alt" onclick="playSound('${alt.file}', this.closest('.se-card'), parseFloat('${alt.dur}'))">
              ▶ ${alt.label} (${alt.dur})
            </button>
          `;
        });
      }

      card.innerHTML = `
        <div class="card-top">
          <div class="card-title-group">
            <div class="card-key">${item.key}</div>
            <div class="card-label">${item.label}</div>
            <div class="card-desc">${item.desc}</div>
          </div>
          <span class="duration-pill">${item.dur}</span>
        </div>
        <div class="button-group">
          <button class="play-btn-primary" onclick="playSound('${item.primary}', this.closest('.se-card'), parseFloat('${item.dur}'))">
            ▶ 本採用
          </button>
          ${altsHtml}
        </div>
        <div class="playing-bar"></div>
      `;
      grid.appendChild(card);
    });

    section.appendChild(grid);
    container.appendChild(section);
  });

  // Simulation Routines
  function wait(ms) {
    return new Promise(r => setTimeout(r, ms));
  }
