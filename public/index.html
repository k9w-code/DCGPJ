<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#030712">
  <title>DCG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Shippori+Mincho:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=v235_fix_cd_text_overlay">
  <link rel="stylesheet" href="/css/lobby-premium.css?v=v235_fix_cd_text_overlay">
</head>
<body>
  <!-- 画面回転プロンプト（横向き推奨） -->
  <div class="rotate-prompt" id="rotate-prompt">
    <div class="rotate-prompt-icon">
      <svg viewBox="0 0 80 80" width="64" height="64" fill="none">
        <rect x="20" y="10" width="40" height="60" rx="6" stroke="currentColor" stroke-width="3"/>
        <circle cx="40" cy="62" r="3" fill="currentColor"/>
        <path d="M60 35 C70 35, 70 25, 60 20" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <path d="M58 17 L62 21 L56 22 Z" fill="#fbbf24"/>
      </svg>
    </div>
    <div style="font-size: 22px; margin-bottom: 8px;">端末を横向きにしてください</div>
    <div style="font-size: 14px; color: #a09880;">Please rotate your device to landscape</div>
  </div>

  <!-- プレミアム背景エフェクト -->
  <div class="premium-bg-container">
    <div class="premium-orb orb-purple"></div>
    <div class="premium-orb orb-gold"></div>
    <div class="premium-orb orb-blue"></div>
    <div class="premium-bg-grid"></div>
  </div>

  <!-- メインロビーコンテナ（1画面完結レイアウト） -->
  <div class="lobby-container">
    <div class="lobby-header">
      <h1 class="game-logo-title">DCG</h1>
      <p class="game-logo-sub">DUEL OF MYTHOLOGY</p>
    </div>

    <div class="lobby-main-card panel">
      <!-- モード選択タブ（SOLO PLAY / ROOM MATCH） -->
      <div class="mode-tab-group">
        <button class="mode-tab-btn active" data-mode="pve" id="mode-pve">
          <span class="mode-tab-en">SOLO PLAY</span>
          <span class="mode-tab-jp">AI対戦</span>
        </button>
        <button class="mode-tab-btn" data-mode="pvp" id="mode-pvp">
          <span class="mode-tab-en">ROOM MATCH</span>
          <span class="mode-tab-jp">対人戦</span>
        </button>
      </div>

      <!-- デッキ選択 & デッキ編成への直接動線 -->
      <div class="deck-select-row">
        <div class="deck-select-info">
          <span class="deck-select-label">使用デッキ</span>
          <select id="active-deck-select" class="deck-dropdown">
            <!-- JavaScriptで動的生成 -->
          </select>
        </div>
        <a href="/deck-builder.html" class="btn-deck-edit" id="btn-goto-deck-builder">
          デッキ編成
        </a>
      </div>

      <!-- プレイヤー設定（アバター選択 & 名前入力） -->
      <div class="player-config-row">
        <div class="avatar-palette" id="avatar-palette">
          <div class="avatar-option active" data-avatar="1"></div>
          <div class="avatar-option" data-avatar="2"></div>
          <div class="avatar-option" data-avatar="3"></div>
          <div class="avatar-option" data-avatar="4"></div>
          <div class="avatar-option" data-avatar="5"></div>
        </div>
        <div class="player-name-wrapper">
          <input type="text" id="player-name" value="プレイヤー" placeholder="プレイヤー名" maxlength="12">
        </div>
      </div>

      <!-- PvEモードエリア（難易度選択 & 対戦開始） -->
      <div class="mode-content" id="pve-content">
        <div class="difficulty-bar">
          <button class="diff-btn" data-difficulty="easy">EASY</button>
          <button class="diff-btn active" data-difficulty="normal">NORMAL</button>
          <button class="diff-btn" data-difficulty="hard">HARD</button>
        </div>
        <button class="btn btn-primary btn-battle-start" id="btn-start-pve">
          対戦開始
        </button>
      </div>

      <!-- PvPモードエリア（ルーム作成 & 参加可能ルーム） -->
      <div class="mode-content" id="pvp-content" style="display: none;">
        <div class="room-create-inline">
          <input type="text" id="room-name" placeholder="ルーム名（任意）" maxlength="15">
          <button class="btn btn-secondary" id="btn-create-room">作成</button>
        </div>
        <div class="pvp-rooms-container">
          <div class="room-list-header">
            <span>参加可能なルーム</span>
            <button class="btn-refresh-text" id="btn-refresh">更新</button>
          </div>
          <div class="room-list" id="room-list"></div>
        </div>
      </div>

      <!-- マッチング・ロード中ステータス表示 -->
      <div id="status-section" class="status-overlay-panel" style="display: none;">
        <div class="status-spinner"></div>
        <p id="status-text" class="pulsing">対戦準備中...</p>
        <button class="btn btn-cancel" id="btn-cancel-queue" style="display: none;">キャンセル</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/audio-manager.js?v=v233_distinct_se"></script>
  <script src="/js/lobby.js?v=v233_distinct_se"></script>

  <script>
    // Force prevent pinch zoom and double tap zoom on mobile
    document.addEventListener('touchstart', function(event) {
      if (event.touches.length > 1) {
        event.preventDefault();
      }
    }, { passive: false });
    
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function(event) {
      const now = (new Date()).getTime();
      if (now - lastTouchEnd <= 300) {
        event.preventDefault();
      }
      lastTouchEnd = now;
    }, false);
    
    document.addEventListener('wheel', function(event) {
      if (event.ctrlKey) {
        event.preventDefault();
      }
    }, { passive: false });

    // iOS Safari Specific: Disable double-tap zoom
    document.addEventListener('gesturestart', function(e) {
      e.preventDefault();
    });
    
    // Ensure AudioContext is resumed on first interaction
    document.addEventListener('pointerdown', function() {
      if (window.audioManager && window.audioManager.audioCtx) {
        if (window.audioManager.audioCtx.state === 'suspended') {
          window.audioManager.audioCtx.resume();
        }
      }
    }, { once: false });

    // Safari Layout Fix: Trigger resize after toolbar state stabilizes
    window.addEventListener('load', function() {
      setTimeout(function() {
        window.dispatchEvent(new Event('resize'));
        window.scrollTo(0, 0);
      }, 300);
    });
  </script>
</body>
</html>
