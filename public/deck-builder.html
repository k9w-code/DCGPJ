<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#030712">
  <title>DCG - デッキ構築 Vol.203</title>
  <script>
    localStorage.removeItem('dcg_session_id');
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        for (let reg of regs) reg.unregister();
      });
    }
  </script>
  <link rel="stylesheet" href="/css/style.css?v=v214_mtg_turn">
  <link rel="stylesheet" href="/css/battle-premium.css?v=v214_mtg_turn">
  <link rel="stylesheet" href="/css/lobby-premium.css?v=v214_mtg_turn">
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- プレミアム背景エフェクト -->
  <div class="premium-bg-container">
    <div class="premium-orb orb-purple"></div>
    <div class="premium-orb orb-gold"></div>
    <div class="premium-orb orb-blue"></div>
    <div class="premium-bg-grid"></div>
  </div>

  <div class="lobby-container">
    <div class="lobby-header">
      <h1>DCG TESTPLAY Vol.173</h1>
      <p>デジタルカードゲーム テストプレイ環境</p>
    </div>
  <div class="rotate-prompt" id="rotate-prompt">
    <div class="rotate-prompt-icon">
      <svg viewBox="0 0 80 80" width="64" height="64" fill="none">
        <rect x="20" y="10" width="40" height="60" rx="6" stroke="currentColor" stroke-width="3"/>
        <circle cx="40" cy="62" r="3" fill="currentColor"/>
        <path d="M60 35 C70 35, 70 25, 60 20" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <path d="M58 17 L62 21 L56 22 Z" fill="#fbbf24"/>
      </svg>
    </div>
    <div style="font-size: 24px; margin-bottom: 10px;">スマホを横向きにしてください</div>
    <div style="font-size: 16px; color: #a09880;">Please rotate your device to landscape</div>
  </div>
  <div class="game-wrapper" id="game-wrapper" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; overflow: hidden; background: #000;">
    <div class="game-container" id="game-container" style="width: 1920px; height: 1080px; position: relative; transform-origin: 0 0; display: block;">
  <div class="deck-builder" style="height: 1080px;">
    <!-- 左ペイン: カード詳細プレビュー -->
    <div class="preview-panel panel">
      <div id="preview-content" class="preview-content empty">
        <p class="empty-msg">カードを選択してください</p>
      </div>
    </div>

    <!-- 中央ペイン: カード・シールド一覧とフィルタ -->
    <div class="collection-panel panel">
      <div class="collection-header">
        <div class="tabs">
          <button class="tab premium-tab active" data-tab="cards">
            <span class="tab-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px; display: inline-block;"><rect x="3" y="6" width="12" height="15" rx="2" transform="rotate(-5 3 6)"/><rect x="8" y="3" width="12" height="15" rx="2" transform="rotate(5 8 3)"/></svg></span> <span class="tab-text">カード</span>
          </button>
          <button class="tab premium-tab" data-tab="shields">
            <span class="tab-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px; display: inline-block;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span> <span class="tab-text">シールド</span>
          </button>
        </div>
        
        <div class="filters" id="card-filters">
          <!-- 色フィルタ: 神族アイコン形式 -->
          <div class="color-filter-bar">
            <button class="tribe-filter active" data-color="white" title="白(神聖)"></button>
            <button class="tribe-filter active" data-color="red" title="赤(火炎)"></button>
            <button class="tribe-filter active" data-color="blue" title="青(海洋)"></button>
            <button class="tribe-filter active" data-color="green" title="緑(自然)"></button>
            <button class="tribe-filter active" data-color="black" title="黒(暗黒)"></button>
          </div>
          <!-- タイプ/コストフィルタ (カード用) -->
          <div class="type-cost-filters" id="card-specific-filters">
            <div class="pill-group type-filters">
              <button class="pill active" data-type="all">すべて</button>
              <button class="pill" data-type="unit">ユニット</button>
              <button class="pill" data-type="spell">スペル</button>
            </div>
            <div class="pill-group cost-filters">
              <button class="pill active" data-cost="all">コスト</button>
              <button class="pill" data-cost="0">0</button>
              <button class="pill" data-cost="1">1</button>
              <button class="pill" data-cost="2">2</button>
              <button class="pill" data-cost="3">3</button>
              <button class="pill" data-cost="4">4</button>
              <button class="pill" data-cost="5">5</button>
              <button class="pill" data-cost="6">6</button>
              <button class="pill" data-cost="7+">7+</button>
            </div>
          </div>
          <!-- 耐久値フィルタ (シールド用) -->
          <div class="type-cost-filters" id="shield-specific-filters" style="display: none;">
            <div class="pill-group durability-filters">
              <button class="pill active" data-durability="all">全耐久</button>
              <button class="pill" data-durability="1">1</button>
              <button class="pill" data-durability="2">2</button>
              <button class="pill" data-durability="3">3</button>
            </div>
          </div>
          <!-- 検索/キーワード/パック/ソートフィルタ -->
          <div class="search-filter-bar">
            <input type="text" id="search-input" placeholder="カードを検索..." class="glass-input">
            <select id="sort-order" class="glass-select" title="カードの並び替え">
              <option value="cost">ソート: コスト順</option>
              <option value="rarity">ソート: レアリティ順</option>
              <option value="atk">ソート: ATK順</option>
              <option value="hp">ソート: HP順</option>
            </select>
            <select id="expansion-filter" class="glass-select" title="パック/拡張セット切り替え">
              <option value="all">すべてのパック</option>
            </select>
            <select id="keyword-filter" class="glass-select">
              <option value="all">すべてのキーワード</option>
            </select>
          </div>
        </div>
      </div>
      
      <!-- カード一覧グリッド -->
      <div class="card-grid" id="card-grid"></div>
      <!-- シールド一覧グリッド（非表示スタート） -->
      <div class="card-grid" id="shield-grid" style="display:none;"></div>
    </div>

    <!-- 右ペイン: 構築中のデッキ情報 -->
    <div class="deck-panel panel">
      <!-- デッキ保存/読み込みスロット -->
      <div class="deck-builder-header">
        <div class="header-left" style="display: flex; align-items: center; gap: 8px; flex-shrink: 0;">
          <!-- ロビーへ戻るボタン -->
          <button class="btn btn-secondary db-nav-btn" onclick="window.location.href='/'" title="ロビーに戻る">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span>ロビー</span>
          </button>
          <!-- ヘルプ（遊び方）ボタン -->
          <button class="btn btn-secondary db-nav-btn" id="btn-show-help" title="ルール・遊び方・キーワード用語集">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
            <span>ヘルプ</span>
          </button>
          <h1 style="margin-left: 4px; font-size: 15px; font-weight: 700; color: #fbbf24; white-space: nowrap;">デッキ編成 Vol.149</h1>
        </div>
        <div class="header-actions">
          <div class="deck-slots-container">
            <span class="slot-label">スロット</span>
            <div class="deck-slots" id="deck-slots"></div>
          </div>
          <div class="deck-action-buttons">
            <!-- 保存 -->
            <button class="btn btn-primary btn-save db-save-btn" id="btn-save-deck" title="現在のデッキをスロットに保存">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px;"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
              保存
            </button>
            <!-- デッキサブ操作メニュー (ドロップダウン) -->
            <div class="deck-menu-container" id="deck-menu-container" style="position: relative;">
              <button class="btn btn-secondary db-icon-btn deck-menu-trigger" id="btn-deck-menu" title="デッキ操作メニュー" style="display: flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 16px; min-width: 95px;">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="19" r="1.5"/>
                </svg>
                <span style="font-size: 13px; font-weight: 600;">メニュー</span>
              </button>
              
              <div class="deck-menu-dropdown" id="deck-menu-dropdown" style="display: none;">
                <button class="deck-menu-item" id="btn-export-image" style="color: #fbbf24; font-weight: 600;">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                  <span>SNS用デッキ画像を出力</span>
                </button>
                <div class="deck-menu-divider"></div>
                <button class="deck-menu-item" id="btn-export-code">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                  <span>デッキコードをコピー</span>
                </button>
                <button class="deck-menu-item" id="btn-import-code">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                  <span>デッキコードから読込</span>
                </button>
                <div class="deck-menu-divider"></div>
                <button class="deck-menu-item" id="btn-copy-slot">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                  <span>他スロットへ複製...</span>
                </button>
                <button class="deck-menu-item" id="btn-compare-slots">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                  <span>スロット間比較...</span>
                </button>
                <div class="deck-menu-divider"></div>
                <button class="deck-menu-item" id="btn-clear-deck">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                  <span>デッキをクリア</span>
                </button>
                <button class="deck-menu-item item-danger" id="btn-delete-deck">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                  <span>スロットを削除</span>
                </button>
                <div class="deck-menu-divider"></div>
                <button class="deck-menu-item" id="btn-reload-master">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                  <span>カードデータ再取得</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="deck-panel-header" style="display: flex; align-items: center; justify-content: space-between;">
        <div class="deck-title-editable" style="display: flex; align-items: center; gap: 6px;">
          <h2 id="deck-title-display" style="margin: 0; font-size: 15px; color: #fbbf24;">スロット 1 のデッキ</h2>
          <button class="btn-icon-sm" id="btn-edit-deck-name" title="デッキ名を変更" style="background: none; border: none; color: #94a3b8; cursor: pointer; padding: 2px;">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          </button>
        </div>
        <div class="deck-counts">
          <span class="deck-count-badge"><span id="deck-count">0</span>/40</span>
          <span class="deck-count-badge shield-badge"><span id="shield-count">0</span>/3</span>
        </div>
      </div>
      
      <!-- デッキ分析パネル（コスト分布 ＆ 色バランス） -->
      <div class="deck-analysis-panel" id="deck-analysis-panel">
        <div class="analysis-section">
          <div class="analysis-title">属性バランス</div>
          <div class="color-balance-bar" id="color-balance-bar"></div>
        </div>
        <div class="analysis-section">
          <div class="analysis-title">コスト曲線</div>
          <div class="mana-curve-chart" id="mana-curve-chart"></div>
        </div>
      </div>
      
      <div class="deck-list-container" id="deck-list">
        <!-- デッキ内のカード一覧 -->
      </div>
      
      <!-- シールドの表示 -->
      <div class="shield-list-section">
        <h3 class="shield-section-title">選択中のシールド (3枚)</h3>
        <div id="shield-slots">
          <!-- 選んだシールド一覧 -->
        </div>
      </div>
      
    <button class="btn btn-primary btn-start-game" id="btn-submit-deck" disabled>このデッキで対戦開始</button>
    </div>
  </div>
    </div>
  </div>

  <div class="overlay card-detail-overlay" id="card-detail-overlay" style="display: none; z-index: 999999999 !important; width: 100dvw !important; height: 100dvh !important; position: fixed !important; top: 0 !important; left: 0 !important;">
    <div class="card-detail-modal">
      <div class="cd-close-btn" id="btn-close-detail"></div>
      <div class="cd-image-area" id="cd-image"></div>
      <div class="cd-info-area">
        <div class="cd-header">
          <div class="cd-cost" id="cd-cost">0</div>
          <h2 class="cd-name" id="cd-name">Card Name</h2>
        </div>
        <div class="cd-type-tags">
          <span class="cd-type-tag" id="cd-type">Unit</span>
          <div class="cd-tribe-tag">
            <div class="cd-tribe-icon" id="cd-tribe-icon"></div>
            <span class="cd-tribe-text" id="cd-tribe-text">Neutral</span>
          </div>
          <div class="cd-rarity" id="cd-rarity">Common</div>
        </div>
        <div class="cd-stats" id="cd-stats-container">
          <div class="cd-stat"><span id="cd-attack" class="atk-box">0</span></div>
          <div class="cd-stat"><span id="cd-hp" class="hp-box">0</span></div>
        </div>
        <div class="cd-text-box">
          <div class="cd-effect-text" id="cd-text"></div>
          <div class="cd-flavor-text" id="cd-flavor"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ヘルプダイアログ (遊び方・ルール解説) -->
  <div class="overlay" id="help-overlay" style="display: none; z-index: 999999; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center;">
    <div class="help-modal glass-panel" style="width: 800px; max-height: 80vh; overflow-y: auto; background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255, 215, 0, 0.3); border-radius: 16px; padding: 24px; color: #e2e8f0; position: relative;">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 12px; margin-bottom: 16px;">
        <h2 style="margin: 0; font-size: 20px; color: #fbbf24; display: flex; align-items: center; gap: 8px;">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          ゲームガイド ＆ 遊び方
        </h2>
        <button id="btn-close-help" class="btn btn-secondary" style="padding: 6px 12px; font-size: 14px;">閉じる ✖</button>
      </div>
      <div id="help-content" class="help-body" style="font-size: 14px; line-height: 1.6;"></div>
    </div>
  </div>

  <!-- スロット間比較モーダル -->
  <div class="overlay compare-modal-overlay" id="compare-modal" style="display: none; z-index: 99999999; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(10, 15, 26, 0.85); backdrop-filter: blur(8px); align-items: center; justify-content: center;">
    <div class="compare-modal-content" style="background: rgba(15, 23, 42, 0.95); border: 1px solid #fbbf24; border-radius: 12px; padding: 20px; width: 90%; max-width: 700px; color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.8);">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(251,191,36,0.3); padding-bottom: 10px; margin-bottom: 15px;">
        <h2 style="margin: 0; font-size: 18px; color: #fbbf24;">🔍 スロットデッキ比較</h2>
        <button id="btn-close-compare" class="btn btn-secondary" style="padding: 4px 10px; font-size: 12px;">閉じる ✖</button>
      </div>
      <div style="display: flex; gap: 10px; margin-bottom: 15px; align-items: center;">
        <label style="font-size: 13px; color: #94a3b8;">比較対象:</label>
        <select id="compare-target-slot" class="glass-select" style="padding: 4px 10px; font-size: 13px;"></select>
      </div>
      <div id="compare-result-area" style="max-height: 400px; overflow-y: auto; background: rgba(0,0,0,0.3); border-radius: 8px; padding: 12px;"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/audio-manager.js?v=v199_COMMERCIAL_GRADE_3D_BOARD_GRID_TEXTURE"></script>
  <script src="/js/game-renderer.js?v=v199_COMMERCIAL_GRADE_3D_BOARD_GRID_TEXTURE"></script>
  <script src="/js/deck-builder.js?v=v199_COMMERCIAL_GRADE_3D_BOARD_GRID_TEXTURE"></script>
  <script>
    function resizeGame() {
      const container = document.getElementById('game-container');
      if (!container) return;
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;
      const scaleX = windowWidth / 1920;
      const scaleY = windowHeight / 1080;
      const scale = Math.min(scaleX, scaleY);
      container.style.transform = `translate(-50%, -50%) scale(${scale})`;
      container.style.position = 'absolute';
      container.style.left = '50%';
      container.style.top = '50%';
      container.style.transformOrigin = 'center center';
    }
    window.addEventListener('resize', resizeGame);
    window.addEventListener('load', resizeGame);
    document.addEventListener('DOMContentLoaded', resizeGame);
    resizeGame();
    document.addEventListener('touchstart', function(e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
    window.addEventListener('load', function() { setTimeout(function() { window.dispatchEvent(new Event('resize')); window.scrollTo(0, 0); }, 500); });
  </script>
</body>
</html>
